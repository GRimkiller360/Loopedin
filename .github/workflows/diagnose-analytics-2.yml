name: Diagnose Analytics v2 (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Dump raw analytics with explicit channel id + narrow ranges
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PYEOF'
          import json
          import sys
          from datetime import date, timedelta
          sys.path.insert(0, ".")
          from pipeline import config

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          creds = Credentials(
              token=None,
              refresh_token=config.require("YOUTUBE_REFRESH_TOKEN"),
              client_id=config.require("YOUTUBE_CLIENT_ID"),
              client_secret=config.require("YOUTUBE_CLIENT_SECRET"),
              token_uri="https://oauth2.googleapis.com/token",
          )

          # creds.scopes only reflects scopes we told this Credentials object to expect
          # (we never did) -- it does NOT reflect what was actually granted. Query
          # Google's tokeninfo endpoint against the live access token instead; that's
          # the only way to see the real, currently-granted scope list.
          import google.auth.transport.requests
          import urllib.request as urlreq
          req = google.auth.transport.requests.Request()
          creds.refresh(req)
          with urlreq.urlopen(f"https://oauth2.googleapis.com/tokeninfo?access_token={creds.token}") as resp:
              tokeninfo = json.loads(resp.read())
          print("=== REAL granted OAuth scopes (from tokeninfo endpoint) ===")
          print(json.dumps(tokeninfo, indent=2))
          print()

          CHANNEL_ID = "UCX17Pmkp9IpNEpTtpoSthlg"  # from channels.list mine=True, confirmed real channel

          analytics = build("youtubeAnalytics", "v2", credentials=creds)

          def run(label, **kwargs):
              print(f"=== {label} ===")
              try:
                  resp = analytics.reports().query(**kwargs).execute()
                  print(json.dumps(resp, indent=2))
              except Exception as e:
                  print(f"EXCEPTION: {type(e).__name__}: {e}")
              print()

          today = date.today()

          run(
              "explicit channel id, yesterday only, views",
              ids=f"channel=={CHANNEL_ID}",
              startDate=(today - timedelta(days=1)).isoformat(),
              endDate=today.isoformat(),
              metrics="views",
          )

          run(
              "explicit channel id, last 2 days, day dimension",
              ids=f"channel=={CHANNEL_ID}",
              startDate=(today - timedelta(days=2)).isoformat(),
              endDate=today.isoformat(),
              metrics="views",
              dimensions="day",
          )

          run(
              "explicit channel id, 90 days, views+estimatedMinutesWatched, no dimension",
              ids=f"channel=={CHANNEL_ID}",
              startDate=(today - timedelta(days=90)).isoformat(),
              endDate=today.isoformat(),
              metrics="views,estimatedMinutesWatched",
          )

          run(
              "channel==MINE, 90 days, views+estimatedMinutesWatched, no dimension (compare to above)",
              ids="channel==MINE",
              startDate=(today - timedelta(days=90)).isoformat(),
              endDate=today.isoformat(),
              metrics="views,estimatedMinutesWatched",
          )

          # Current live channel totals via the Data API, for comparison against
          # whatever Analytics says -- confirms whether the channel has real
          # accumulated activity by now (it's been days since the last check).
          youtube = build("youtube", "v3", credentials=creds)
          ch = youtube.channels().list(part="snippet,statistics", mine=True).execute()
          print("=== current channels.list (Data API) stats ===")
          print(json.dumps(ch["items"][0]["statistics"], indent=2))
          print("channel published at:", ch["items"][0]["snippet"]["publishedAt"])
          PYEOF
