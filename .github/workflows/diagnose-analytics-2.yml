name: Diagnose Analytics v2 (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Dump raw analytics with explicit channel id + narrow ranges
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PYEOF'
          import json
          import sys
          from datetime import date, timedelta
          sys.path.insert(0, ".")
          from pipeline import config

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          creds = Credentials(
              token=None,
              refresh_token=config.require("YOUTUBE_REFRESH_TOKEN"),
              client_id=config.require("YOUTUBE_CLIENT_ID"),
              client_secret=config.require("YOUTUBE_CLIENT_SECRET"),
              token_uri="https://oauth2.googleapis.com/token",
          )

          # Print the actual granted scopes on this token -- if yt-analytics.readonly
          # isn't in here, that's the whole answer.
          import google.auth.transport.requests
          req = google.auth.transport.requests.Request()
          creds.refresh(req)
          print("=== granted OAuth scopes on this refresh token ===")
          print(creds.scopes)
          print()

          CHANNEL_ID = "UCX17Pmkp9IpNEpTtpoSthlg"  # from channels.list mine=True, confirmed real channel

          analytics = build("youtubeAnalytics", "v2", credentials=creds)

          def run(label, **kwargs):
              print(f"=== {label} ===")
              try:
                  resp = analytics.reports().query(**kwargs).execute()
                  print(json.dumps(resp, indent=2))
              except Exception as e:
                  print(f"EXCEPTION: {type(e).__name__}: {e}")
              print()

          today = date.today()

          run(
              "explicit channel id, yesterday only, views",
              ids=f"channel=={CHANNEL_ID}",
              startDate=(today - timedelta(days=1)).isoformat(),
              endDate=today.isoformat(),
              metrics="views",
          )

          run(
              "explicit channel id, last 2 days, day dimension",
              ids=f"channel=={CHANNEL_ID}",
              startDate=(today - timedelta(days=2)).isoformat(),
              endDate=today.isoformat(),
              metrics="views",
              dimensions="day",
          )

          run(
              "explicit channel id, video dimension, last 2 days, no filter",
              ids=f"channel=={CHANNEL_ID}",
              startDate=(today - timedelta(days=2)).isoformat(),
              endDate=today.isoformat(),
              metrics="views",
              dimensions="video",
              sort="-views",
          )

          run(
              "channel==MINE, video dimension, last 2 days, no filter (compare to above)",
              ids="channel==MINE",
              startDate=(today - timedelta(days=2)).isoformat(),
              endDate=today.isoformat(),
              metrics="views",
              dimensions="video",
              sort="-views",
          )
          PYEOF
