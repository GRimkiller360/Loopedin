name: Update Channel Branding

on:
  workflow_dispatch:
    inputs:
      description:
        description: "New About-section description for the channel"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet google-auth google-api-python-client

      - name: Update channel description
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CHANNEL_DESCRIPTION: ${{ inputs.description }}
        run: python pipeline/update_channel_branding.py --description "$CHANNEL_DESCRIPTION"
