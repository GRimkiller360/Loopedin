name: Analytics Feedback

on:
  schedule:
    # once/day is enough -- conserves Analytics API quota
    - cron: "50 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Pull performance and summarize
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline/analytics_feedback.py > /tmp/summary.json
          python -c "
          import json
          rows = json.load(open('/tmp/summary.json'))
          lines = ['# Performance summary (auto-generated, read this before writing a script)', '']
          if not rows:
              lines.append('No performance data yet -- not enough uploads/history to summarize.')
          else:
              lines.append('Top topics by average view percentage:')
              for r in rows:
                  lines.append(f\"- {r['topic']}: {r['avg_view_pct']:.1f}% avg view\")
          open('state/performance_summary.md', 'w').write('\n'.join(lines) + '\n')
          "

      - name: Commit summary
        run: |
          git config user.name "loopedin-bot"
          git config user.email "actions@github.com"
          git add state/performance_log.json state/performance_summary.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update performance summary"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (another workflow likely committed at the same time), retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::Failed to push performance summary after 5 retries"
          exit 1
