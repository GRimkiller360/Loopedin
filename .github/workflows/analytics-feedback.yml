name: Analytics Feedback

on:
  schedule:
    # Once/day is genuinely enough here, not just a quota-saving shortcut: YouTube
    # Analytics data itself only settles on a ~24-48h cycle, so querying more often
    # than that just re-fetches identical numbers. What matters is *timing* --
    # run right before the first trend-fetch/routine cycle of the day (00:03/00:13
    # UTC) so every fire that day reads the freshest available snapshot, instead of
    # the old 06:50 slot which left the first few fires of the day reading
    # yesterday's data.
    - cron: "55 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Pull performance and summarize
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline/analytics_feedback.py > /tmp/summary.json
          python -c "
          import json
          data = json.load(open('/tmp/summary.json'))
          by_category, by_topic = data['by_category'], data['by_topic']
          lines = ['# Performance summary (auto-generated, read this before writing a script)', '']
          if not by_category:
              lines.append('No performance data yet -- not enough uploads/history to summarize.')
          else:
              lines.append('## Top categories by average view percentage (steer topic choice by this)')
              lines.append('')
              for r in by_category:
                  lines.append(f\"- {r['name']}: {r['avg_view_pct']:.1f}% avg view (n={r['sample_size']})\")
              lines.append('')
              lines.append('## Top individual topics (reference only -- these exact topics are already used)')
              lines.append('')
              for r in by_topic:
                  lines.append(f\"- {r['name']}: {r['avg_view_pct']:.1f}% avg view\")
          open('state/performance_summary.md', 'w').write('\n'.join(lines) + '\n')
          "

      - name: Commit summary
        run: |
          git config user.name "loopedin-bot"
          git config user.email "actions@github.com"
          git add state/performance_log.json state/performance_summary.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update performance summary"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (another workflow likely committed at the same time), retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::Failed to push performance summary after 5 retries"
          exit 1
