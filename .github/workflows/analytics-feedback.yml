name: Analytics Feedback

on:
  schedule:
    # Once/day is genuinely enough here, not just a quota-saving shortcut: YouTube
    # Analytics data itself only settles on a ~24-48h cycle, so querying more often
    # than that just re-fetches identical numbers. What matters is *timing* --
    # run right before the first trend-fetch/routine cycle of the day (00:03/00:13
    # UTC) so every fire that day reads the freshest available snapshot, instead of
    # the old 06:50 slot which left the first few fires of the day reading
    # yesterday's data.
    - cron: "55 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Backfill upload metadata for pre-refactor videos
        # Idempotent -- only fills used_topics.json entries still missing uploaded_at
        # (a no-op once every video has it). Needed so live_stats.py's tracking and the
        # dashboard's per-video table cover every uploaded video, not just ones
        # uploaded after record_used_topic() started auto-recording this itself.
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/backfill_upload_meta.py

      - name: Pull performance and summarize
        # Markdown rendering lives in pipeline/analytics_feedback.py itself now (was an
        # inline python -c heredoc here before it grew past the point that was
        # maintainable) -- --summary-out writes state/performance_summary.md directly.
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline/analytics_feedback.py --summary-out state/performance_summary.md \
            --dashboard-out /tmp/youtube-status-payload.json

      - name: Commit summary
        run: |
          git config user.name "loopedin-bot"
          git config user.email "actions@github.com"
          mkdir -p /tmp/fresh_state
          cp state/performance_log.json state/performance_summary.md /tmp/fresh_state/
          git add state/performance_log.json state/performance_summary.md state/used_topics.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update performance summary"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (another workflow likely committed at the same time), retrying ($i/5)..."
            # performance_log.json/performance_summary.md are full snapshots
            # regenerated each run (used_topics.json is untouched by this workflow,
            # only read) -- nothing meaningful to merge, so don't rebase (a real
            # content conflict here aborts the retry loop immediately, as seen in
            # production on trend-fetch.yml's identical pattern). Reset to the new
            # remote tip and re-apply this run's own fresh content on top instead.
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fresh_state/performance_log.json /tmp/fresh_state/performance_summary.md state/
            git add state/performance_log.json state/performance_summary.md
            git commit -m "Update performance summary"
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::Failed to push performance summary after 5 retries"
          exit 1

      - name: Push snapshot to car-loan-dashboard
        # Mirrors the same pattern the bracketly repo uses to feed its own status
        # page on the same dashboard app -- see that repo's
        # .github/workflows/status-check.yml. continue-on-error since the
        # dashboard being briefly unreachable shouldn't fail this whole workflow;
        # state/performance_summary.md (the thing the routine actually depends
        # on) is already committed by the step above regardless.
        continue-on-error: true
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          LOOPEDIN_INGEST_SECRET: ${{ secrets.LOOPEDIN_INGEST_SECRET }}
        run: |
          # -L --post301 --post302 --post303: follow any redirect while preserving
          # the POST method and body -- without these flags curl silently downgrades
          # a redirected POST to a bodyless GET instead of erroring. DASHBOARD_URL
          # must be the bare origin only (no trailing slash, no path) -- appending
          # any path here previously caused the constructed URL to miss the ingest
          # route entirely, redirect to /login, and crash there instead.
          curl -sL --post301 --post302 --post303 -X POST "$DASHBOARD_URL/api/youtube-status/ingest" \
            -H "X-Ingest-Secret: $LOOPEDIN_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/youtube-status-payload.json \
            -w "\nHTTP_STATUS:%{http_code}\n"
