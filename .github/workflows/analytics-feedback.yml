name: Analytics Feedback

on:
  schedule:
    # Once/day is genuinely enough here, not just a quota-saving shortcut: YouTube
    # Analytics data itself only settles on a ~24-48h cycle, so querying more often
    # than that just re-fetches identical numbers. What matters is *timing* --
    # run right before the first trend-fetch/routine cycle of the day (00:03/00:13
    # UTC) so every fire that day reads the freshest available snapshot, instead of
    # the old 06:50 slot which left the first few fires of the day reading
    # yesterday's data.
    - cron: "55 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Pull performance and summarize
        # Markdown rendering lives in pipeline/analytics_feedback.py itself now (was an
        # inline python -c heredoc here before it grew past the point that was
        # maintainable) -- --summary-out writes state/performance_summary.md directly.
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline/analytics_feedback.py --summary-out state/performance_summary.md \
            --dashboard-out /tmp/youtube-status-payload.json

      - name: Commit summary
        run: |
          git config user.name "loopedin-bot"
          git config user.email "actions@github.com"
          git add state/performance_log.json state/performance_summary.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update performance summary"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (another workflow likely committed at the same time), retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::Failed to push performance summary after 5 retries"
          exit 1

      - name: Push snapshot to car-loan-dashboard
        # Mirrors the same pattern the bracketly repo uses to feed its own status
        # page on the same dashboard app -- see that repo's
        # .github/workflows/status-check.yml. continue-on-error since the
        # dashboard being briefly unreachable shouldn't fail this whole workflow;
        # state/performance_summary.md (the thing the routine actually depends
        # on) is already committed by the step above regardless.
        continue-on-error: true
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          LOOPEDIN_INGEST_SECRET: ${{ secrets.LOOPEDIN_INGEST_SECRET }}
        run: |
          # -L --post301 --post302 --post303: follow any redirect (e.g. an
          # http->https upgrade at Cloudflare's edge) while preserving the POST
          # method and body -- without these flags curl silently downgrades a
          # redirected POST to a bodyless GET instead of erroring, which looked
          # like a mysterious 302 with no obvious cause.
          curl -sL --post301 --post302 --post303 -X POST "$DASHBOARD_URL/api/youtube-status/ingest?debug=1" \
            -H "X-Ingest-Secret: $LOOPEDIN_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/youtube-status-payload.json \
            -w "\nHTTP_STATUS:%{http_code}\n"
