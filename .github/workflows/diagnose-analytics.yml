name: Diagnose Analytics (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Dump raw channel + analytics state
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PYEOF'
          import json
          import sys
          from datetime import date, timedelta
          sys.path.insert(0, ".")
          from pipeline import config

          yt = config.youtube_client()
          ch = yt.channels().list(part="snippet,statistics,contentOwnerDetails", mine=True).execute()
          print("=== channels.list (Data API, mine=True) ===")
          print(json.dumps(ch, indent=2))

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds = Credentials(
              token=None,
              refresh_token=config.require("YOUTUBE_REFRESH_TOKEN"),
              client_id=config.require("YOUTUBE_CLIENT_ID"),
              client_secret=config.require("YOUTUBE_CLIENT_SECRET"),
              token_uri="https://oauth2.googleapis.com/token",
          )
          analytics = build("youtubeAnalytics", "v2", credentials=creds)

          print()
          print("=== analytics: channel-wide views, last 90 days, no dimensions ===")
          try:
              resp = analytics.reports().query(
                  ids="channel==MINE",
                  startDate=(date.today() - timedelta(days=90)).isoformat(),
                  endDate=date.today().isoformat(),
                  metrics="views,estimatedMinutesWatched",
              ).execute()
              print(json.dumps(resp, indent=2))
          except Exception as e:
              print(f"EXCEPTION: {type(e).__name__}: {e}")

          print()
          print("=== analytics: channel-wide views by day, last 14 days ===")
          try:
              resp = analytics.reports().query(
                  ids="channel==MINE",
                  startDate=(date.today() - timedelta(days=14)).isoformat(),
                  endDate=date.today().isoformat(),
                  metrics="views",
                  dimensions="day",
              ).execute()
              print(json.dumps(resp, indent=2))
          except Exception as e:
              print(f"EXCEPTION: {type(e).__name__}: {e}")
          PYEOF
