name: Trend Seed Fetch

on:
  schedule:
    # ~10 min before each Claude routine fire (routine fires at :53 past 3/6/9/12/15/18
    # UTC -- 6x/day, every 3h, 05:00-20:00 Africa/Johannesburg (channel owner's active
    # hours) -- confirmed via RemoteTrigger get). Cut from 10x/day spread across all 24h
    # to 6x/day within this window 2026-08-20: raw upload volume wasn't what this
    # channel's own data showed was the constraint (shares/subs stayed flat regardless
    # of cadence), and near-hourly/round-the-clock uploads risk both YouTube's
    # "mass-produced/inauthentic content" monetization policy and overwhelming a
    # still-tiny subscriber base's feed. Matched 1:1 to the routine's cadence
    # deliberately -- firing more often than the routine consumes seeds just burns
    # YouTube Data API quota (search.list is 100 units/call x up to 5 categories) on
    # fetches nothing reads.
    - cron: "43 3,6,9,12,15,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Fetch trend seed
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -m pip install --quiet google-auth google-api-python-client
          python pipeline/trend_source.py --out state/latest_trend_seed.json

      - name: Refresh live stats for recent uploads
        # Piggybacks on this workflow's existing cadence/credentials rather than a
        # separate workflow -- videos.list stats update far faster than YouTube
        # Analytics, so this is what gives an early-velocity signal within hours of
        # upload instead of waiting ~24-48h for Analytics to settle.
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/live_stats.py --live-stats state/live_stats.json

      - name: Commit trend seed
        run: |
          git config user.name "loopedin-bot"
          git config user.email "actions@github.com"
          mkdir -p /tmp/fresh_state
          cp state/latest_trend_seed.json state/live_stats.json /tmp/fresh_state/
          git add state/latest_trend_seed.json state/live_stats.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update trend seed"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (another workflow likely committed at the same time), retrying ($i/5)..."
            # These files are full snapshots regenerated each run, not an
            # accumulating log -- there's nothing meaningful to merge between two
            # runs' fresh data, so don't rebase (a real content conflict here
            # aborts the whole retry loop immediately, as it has in production).
            # Reset to the new remote tip and re-apply this run's own fresh
            # content on top instead.
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fresh_state/latest_trend_seed.json /tmp/fresh_state/live_stats.json state/
            git add state/latest_trend_seed.json state/live_stats.json
            git commit -m "Update trend seed"
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::Failed to push trend seed after 5 retries"
          exit 1
