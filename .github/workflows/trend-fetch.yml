name: Trend Seed Fetch

on:
  schedule:
    # ~10 min before each Claude routine fire, so the seed is ready when it reads it
    - cron: "3 0,2,5,7,10,12,14,17,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trend seed
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python -m pip install --quiet google-auth google-api-python-client
          python pipeline/trend_source.py --out state/latest_trend_seed.json

      - name: Commit trend seed
        run: |
          git config user.name "loopedin-bot"
          git config user.email "actions@github.com"
          git add state/latest_trend_seed.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update trend seed" && git push)
