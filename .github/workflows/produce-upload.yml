name: Produce and Upload Short

on:
  push:
    branches:
      - main
    paths:
      - "state/pending_script.json"
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload privacy for a manual test run"
        default: "unlisted"
        type: choice
        options: [unlisted, public, private]

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: bash setup_env.sh

      - name: Health check
        id: health
        run: |
          python - <<'EOF'
          import os
          from pipeline.state_utils import is_paused
          paused, reason = is_paused("state/routine_health.json")
          # GITHUB_OUTPUT only accepts key=value lines -- a raw ::warning:: workflow
          # command written into that file (as the old `>> "$GITHUB_OUTPUT"` redirect
          # on the whole block did) makes the runner reject the file outright ("Unable
          # to process file command 'output' successfully"), crashing this step instead
          # of cleanly reporting "paused, skipping" like it's supposed to. Write the
          # output key explicitly and let the warning go to the step's own stdout.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"paused={str(paused).lower()}\n")
          if paused:
              print(f"::warning::Routine is paused: {reason}")
          EOF

      - name: Script exists check
        # The push trigger fires on deletions too (e.g. a manual state-reconciliation
        # commit that removes pending_script.json still matches the path filter) --
        # without this, "Validate script" crashes on a file that's legitimately gone
        # and falsely increments the failure counter. Not paused/quota-related, so
        # this is checked unconditionally and gates everything below.
        id: script_check
        run: |
          if [ -f state/pending_script.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::state/pending_script.json doesn't exist (likely a deletion-only commit, e.g. state reconciliation) -- nothing to produce, skipping."
          fi

      - name: Quota check
        id: quota
        # No artificial ceiling -- see pipeline/quota_guard.py. The only limiter is
        # YouTube's own quota rejection, handled reactively after the Upload step below.
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true'
        run: |
          RESULT=$(python pipeline/quota_guard.py check)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" = "capped" ]; then
            echo "::warning::Today's upload quota is exhausted (a real YouTube quota rejection earlier today) -- skipping to avoid wasting API calls until reset. This is expected, not a failure; it does not count toward auto-pause."
          fi

      - name: Validate script
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        run: python pipeline/script_schema.py state/pending_script.json

      - name: Quality gate
        # Catches the routine not actually following ROUTINE_INSTRUCTIONS.md (lazy
        # filler opener, near-duplicate title, narration length way off target) before
        # any TTS/b-roll/assembly/upload cost is spent on it. Treated as a production
        # failure below like any other -- counts toward auto-pause, leaves
        # pending_script.json in place for a human to inspect.
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        run: python pipeline/quality_gate.py state/pending_script.json state/used_topics.json

      - name: Narration
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        env:
          GOOGLE_TTS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON }}
        run: python pipeline/tts.py --script state/pending_script.json --out work/narration.mp3

      - name: B-roll
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python pipeline/broll.py --script state/pending_script.json --work-dir work/broll > work/broll_clips.json

      - name: Assemble
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        run: |
          python pipeline/assemble.py --script state/pending_script.json \
            --narration work/narration.mp3 --clips work/broll_clips.json \
            --work-dir work/assemble --out work/final.mp4

      - name: Upload
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        id: upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # No repo variable in the mix on purpose -- vars.UPLOAD_PRIVACY silently
          # changed to 'unlisted' on 2026-08-19 with no visible error, and every real
          # (push-triggered) upload since went out unlisted until this was caught. A
          # push-triggered run has no `inputs` context, so it always falls straight to
          # 'public' here now -- nothing external can quietly flip it again. Manual
          # workflow_dispatch test runs are unaffected: their own input above always
          # has a value (its own default is 'unlisted'), so `inputs.privacy` is never
          # empty for that trigger and this fallback is never reached.
          PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          set -o pipefail
          if python pipeline/upload.py --video work/final.mp4 --script state/pending_script.json \
            --privacy "$PRIVACY" | tee work/upload_result.json; then
            exit_code=0
          else
            exit_code=${PIPESTATUS[0]}
          fi
          if [ "$exit_code" -eq 2 ]; then
            echo "quota_exceeded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "quota_exceeded=false" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Record state on success
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped' && steps.upload.outputs.quota_exceeded != 'true' && success()
        id: record
        run: |
          python -c "
          import json
          import os
          import subprocess
          from pipeline.state_utils import record_used_topic, record_success
          from pipeline.script_schema import RULESET_VERSION

          script = json.load(open('state/pending_script.json', encoding='utf-8'))
          result = json.load(open('work/upload_result.json', encoding='utf-8'))

          # Measured from the actual assembled file, not estimated from word count --
          # more accurate, and doesn't depend on the routine's narration pace guess.
          duration = float(subprocess.check_output([
              'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
              '-of', 'default=noprint_wrappers=1:nokey=1', 'work/final.mp4',
          ]).strip())

          record_used_topic(
              'state/used_topics.json', script['topic'], result['video_id'],
              category=script.get('category'),
              seed_source_video_id=script.get('seed_source_video_id'),
              seed_view_count=script.get('seed_view_count'),
              hook_type=script.get('hook_type'),
              title=script.get('title'),
              duration_seconds=round(duration, 1),
              # Stamped by code, not the agent -- see script_schema.py's comment.
              ruleset_version=RULESET_VERSION,
              # Recorded (not just validated) so a post-hoc review can actually compare
              # specific share_trigger/contradicted_belief wording against real
              # shares/subs, not just know the fields existed -- see
              # state/ruleset_changelog.json's 2026-08-20 share-trigger entry.
              share_trigger=script.get('share_trigger'),
              contradicted_belief=script.get('contradicted_belief'),
              has_sources=bool(script.get('sources')),
          )
          record_success('state/routine_health.json')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f\"category={script.get('category', '')}\n\")
              f.write(f\"video_id={result['video_id']}\n\")
          "
          python pipeline/quota_guard.py record
          rm -f state/pending_script.json

      - name: Record quota exhaustion
        # YouTube's own hard reject, not a bug -- mark today exhausted so later runs
        # today skip early (Quota check step) instead of wasting narration/b-roll/
        # assembly work only to hit the same wall again. Clear the pending script so
        # the routine isn't stuck behind it tomorrow -- it never actually published,
        # so it's not recorded in used_topics.json either; a fresh trend seed will
        # replace it on the next cron fire once quota resets.
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped' && steps.upload.outputs.quota_exceeded == 'true'
        run: |
          python pipeline/quota_guard.py exhaust
          rm -f state/pending_script.json

      - name: Record failure
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped' && steps.upload.outputs.quota_exceeded != 'true' && failure()
        run: |
          python -c "
          from pipeline.state_utils import record_failure
          import pipeline.config as c
          paused = record_failure('state/routine_health.json', 'produce-upload workflow failed, see run log', c.CONSECUTIVE_FAILURES_TO_PAUSE)
          print('routine auto-paused' if paused else 'failure recorded, not yet paused')
          "
          # Clear it so the next hourly fire can try a fresh script instead of
          # silently no-op'ing forever behind an unresolved in-flight file -- the
          # failed script itself is never lost, it's still in this commit's git
          # history. A single bad script used to block production for hours with
          # no alert until this was cleared by hand (2026-08-20 incident).
          rm -f state/pending_script.json

      - name: Commit state
        if: always() && steps.health.outputs.paused != 'true'
        run: |
          git config user.name "loopedin-bot"
          git config user.email "actions@github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Record run result"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (another workflow likely committed at the same time), retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::Failed to push state after 5 retries"
          exit 1
