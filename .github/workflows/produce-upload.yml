name: Produce and Upload Short

on:
  push:
    paths:
      - "state/pending_script.json"
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload privacy for a manual test run"
        default: "unlisted"
        type: choice
        options: [unlisted, public, private]

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bash setup_env.sh

      - name: Health check
        id: health
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          from pipeline.state_utils import is_paused
          paused, reason = is_paused("state/routine_health.json")
          print(f"paused={str(paused).lower()}")
          if paused:
              print(f"::warning::Routine is paused: {reason}")
          EOF

      - name: Script exists check
        # The push trigger fires on deletions too (e.g. a manual state-reconciliation
        # commit that removes pending_script.json still matches the path filter) --
        # without this, "Validate script" crashes on a file that's legitimately gone
        # and falsely increments the failure counter. Not paused/quota-related, so
        # this is checked unconditionally and gates everything below.
        id: script_check
        run: |
          if [ -f state/pending_script.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::state/pending_script.json doesn't exist (likely a deletion-only commit, e.g. state reconciliation) -- nothing to produce, skipping."
          fi

      - name: Quota check
        id: quota
        # daily-cap is a sanity ceiling on attempts, not the primary limiter -- see
        # pipeline/quota_guard.py. The real limiter is YouTube's own quota rejection,
        # handled reactively after the Upload step below.
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true'
        run: |
          RESULT=$(python pipeline/quota_guard.py check --daily-cap "${{ vars.DAILY_UPLOAD_CAP || 8 }}")
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" = "capped" ]; then
            echo "::warning::Today's upload quota is exhausted (either the attempt ceiling or a real YouTube quota rejection earlier today) -- skipping to avoid wasting API calls until reset. This is expected, not a failure; it does not count toward auto-pause."
          fi

      - name: Validate script
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        run: python pipeline/script_schema.py state/pending_script.json

      - name: Narration
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        env:
          GOOGLE_TTS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON }}
        run: python pipeline/tts.py --script state/pending_script.json --out work/narration.mp3

      - name: B-roll
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python pipeline/broll.py --script state/pending_script.json --work-dir work/broll > work/broll_clips.json

      - name: Assemble
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        run: |
          python pipeline/assemble.py --script state/pending_script.json \
            --narration work/narration.mp3 --clips work/broll_clips.json \
            --work-dir work/assemble --out work/final.mp4

      - name: Upload
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped'
        id: upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy || vars.UPLOAD_PRIVACY || 'unlisted' }}
        run: |
          set -o pipefail
          if python pipeline/upload.py --video work/final.mp4 --script state/pending_script.json \
            --privacy "$PRIVACY" | tee work/upload_result.json; then
            exit_code=0
          else
            exit_code=${PIPESTATUS[0]}
          fi
          if [ "$exit_code" -eq 2 ]; then
            echo "quota_exceeded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "quota_exceeded=false" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Record state on success
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped' && steps.upload.outputs.quota_exceeded != 'true' && success()
        run: |
          python -c "
          import json
          from pipeline.state_utils import record_used_topic, record_success

          script = json.load(open('state/pending_script.json', encoding='utf-8'))
          result = json.load(open('work/upload_result.json', encoding='utf-8'))
          record_used_topic('state/used_topics.json', script['topic'], result['video_id'], script.get('category'), script.get('seed_source_video_id'), script.get('hook_type'))
          record_success('state/routine_health.json')
          "
          python pipeline/quota_guard.py record --daily-cap "${{ vars.DAILY_UPLOAD_CAP || 8 }}"
          rm -f state/pending_script.json

      - name: Record quota exhaustion
        # YouTube's own hard reject, not a bug -- mark today exhausted so later runs
        # today skip early (Quota check step) instead of wasting narration/b-roll/
        # assembly work only to hit the same wall again. Clear the pending script so
        # the routine isn't stuck behind it tomorrow -- it never actually published,
        # so it's not recorded in used_topics.json either; a fresh trend seed will
        # replace it on the next cron fire once quota resets.
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped' && steps.upload.outputs.quota_exceeded == 'true'
        run: |
          python pipeline/quota_guard.py exhaust
          rm -f state/pending_script.json

      - name: Record failure
        if: steps.health.outputs.paused != 'true' && steps.script_check.outputs.exists == 'true' && steps.quota.outputs.result != 'capped' && steps.upload.outputs.quota_exceeded != 'true' && failure()
        run: |
          python -c "
          from pipeline.state_utils import record_failure
          import pipeline.config as c
          paused = record_failure('state/routine_health.json', 'produce-upload workflow failed, see run log', c.CONSECUTIVE_FAILURES_TO_PAUSE)
          print('routine auto-paused' if paused else 'failure recorded, not yet paused')
          "

      - name: Commit state
        if: always() && steps.health.outputs.paused != 'true'
        run: |
          git config user.name "loopedin-bot"
          git config user.email "actions@github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Record run result"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (another workflow likely committed at the same time), retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::Failed to push state after 5 retries"
          exit 1
